plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anzakchat.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.anzakchat.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0-java-phase1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Faz 1: Login/Register/Oda-DM listesi artık FirebaseClient (OkHttp REST) ile
    // Firebase Realtime Database'e doğrudan bağlanıyor — ayrı bir sunucu/VPS gerekmez.
    // ChatActivity (mesajlaşmanın kendisi) henüz eski özel backend'e (ApiClient +
    // Socket.IO) bağlı — bir sonraki adımda Firebase'e taşınacak.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.socket:socket.io-client:2.1.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
